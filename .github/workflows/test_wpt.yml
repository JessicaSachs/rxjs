name: Run WPT

on:
  workflow_dispatch: # Allow running on-demand
  push:
  # pull_request:
  #   types: [opened, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  WPT_MANIFEST: ${{ github.workspace }}/wpt/MANIFEST.json
  WPT_REPO: web-platform-tests/wpt
  WPT_REF: master
  SOURCE_REPO: ${{ github.repository }}
  SOURCE_COMMIT: ${{ github.sha }}
  SOURCE_BRANCH: ${{ github.ref_name }}
  RESULTS_BRANCH: ${{ github.ref_name }}-wpt-results
  WPT_POLYFILL_PATH: ${{ github.workspace }}/resources/CI-CD/temporary-wpt-polyfill.js
  TEST_RESULTS_PATH: ${{ github.workspace }}/test-results
  TEST_PATH: dom/observable # The folder within wpt that contains the tests to run

jobs:
  test:
    name: Run WPT
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.action == 'reopened'
    steps:
      - uses: actions/checkout@v4
      # - name: Check if WPT results branch exists
      #   id: results-branch-exists
      #   run: echo "EXISTS=$(git ls-remote --heads origin $RESULTS_BRANCH | wc -l)" >> $GITHUB_OUTPUT
      # - name: Create WPT results branch
      #   if: steps.results-branch-exists.outputs.EXISTS == '0'
      #   run: |
      #     git checkout --orphan $RESULTS_BRANCH
      #     git rm -rf .
      #     mkdir test-results
      #     touch test-results/history.html
      #     git add .
      #     git config user.name github-actions
      #     git config user.email github-actions@github.com
      #     git commit -m "Initial WPT history commit"
      #     git push origin $RESULTS_BRANCH
      #     git switch ${{ github.ref_name }}
      - name: Clone WPT results branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RESULTS_BRANCH }}
          path: wpt-results
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install yarn
        run: corepack enable && corepack prepare yarn@1.22 --activate
      
      - name: Install dependencies
        run: yarn install

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.10.4

      - name: Clone WPT repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.WPT_REPO }}
          ref: ${{ env.WPT_REF }}
          path: wpt

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      # - name: Get WPT commit SHA
      #   run: echo "WPT_COMMIT=$(cd wpt; git rev-parse HEAD)" >> $GITHUB_ENV

      - name: Setup WPT
        working-directory: wpt
        run: |
          ./wpt make-hosts-file | sudo tee -a /etc/hosts

      - name: Run Tests
        env:
          TEST_RESULTS_PATH: ${{ env.TEST_RESULTS_PATH }}
          HTML_REPORT_PATH: ${{ env.TEST_RESULTS_PATH }}/test-report.html
          GROUPED_LOG_PATH: ${{ env.TEST_RESULTS_PATH }}/test-grouped.log
        run: |
          mkdir -p $TEST_RESULTS_PATH
          cd wpt
          ./wpt run chrome ${{ env.TEST_PATH }} \
          -y \
          --inject-script=${{ env.WPT_POLYFILL_PATH }} \
          --log-html=$HTML_REPORT_PATH \
          --log-grouped=$GROUPED_LOG_PATH

      - name: Print out test results
        if: always()
        run: |
          ls -la test-results
          cat test-results/out.html

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wpt-test-results-${{ github.sha }}
          path: ${{ env.TEST_RESULTS_PATH }}
          retention-days: 14

      - name: Find Comment
        uses: peter-evans/find-comment@v3
        if: github.event_name == 'pull_request' || github.event_name == 'pull_request_target'
        id: find-comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: '<!-- WPT_RESULTS -->'

      - name: Create or Update Comment
        uses: peter-evans/create-or-update-comment@v4
        if: github.event_name == 'pull_request' || github.event_name == 'pull_request_target'
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            <!-- WPT_RESULTS -->
            ## Latest WPT Results
            
            Results from commit: ${{ github.sha }}
            
            📊 [Download Full HTML Report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts)
            
            _Last updated: $(date -u "+%Y-%m-%d %H:%M:%S UTC")_
          edit-mode: replace

